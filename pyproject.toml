[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planner"
version = "0.2.0"
description = "Domain model and REST API for the Obsidian planner vault"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
mcp = ["mcp>=1.0"]
docs = ["pdoc>=14"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "fastapi>=0.110", "mcp>=1.0", "pdoc>=14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Tests are named for the module they cover: src/planner/domain/note.py is exercised
# by tests/domain/note.integration.test.py. A dotted filename is not a legal module
# name, so the default "prepend" import mode cannot load it -- importlib can.
python_files = ["*.test.py"]
python_classes = ["Test*", "Describe*"]
python_functions = ["test_*", "it_*"]

addopts = """
  -q --strict-markers --import-mode=importlib
  --cov=planner --cov-report=term-missing:skip-covered --cov-report=html:htmlcov
  --cov-fail-under=98
"""

markers = [
  "slow: exercises the real filesystem or a live server",
]

filterwarnings = [
  "error::DeprecationWarning",
  "ignore::UserWarning",
  "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.coverage.run]
source = ["planner"]
branch = true
omit = [
  # Process entry point: `python -m planner.mcp`. Running it means starting a real
  # stdio server, which a unit suite has no business doing -- the dispatch it calls
  # is covered directly in mcp/server.integration.test.py.
  "*/planner/mcp/__main__.py",
]

[tool.coverage.report]
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",                    # Protocol method bodies
  "if __name__ == .__main__.:",
  "pragma: no cover",
]
