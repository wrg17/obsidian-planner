[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planner"
version = "0.2.0"
description = "Domain model and REST API for the Obsidian planner vault"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "mcp>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error::DeprecationWarning",
  # Starlette's TestClient warns about httpx; not ours to fix.
  "ignore::UserWarning",
  "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]
