# Local gate. The same checks CI runs, but in the second before a commit rather than
# the minutes after a push -- which matters most for an agent, because a failure it
# sees immediately gets fixed in the same breath, and one it sees after a round trip
# often lands as a second "fix lint" commit on top.
#
#     cd .tooling && .venv/bin/pre-commit install
#
# `make check` remains the real gate; this is the fast subset that needs no database.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-format
        files: ^\.tooling/(src|tests|demo)/
      - id: ruff
        args: [--fix]
        files: ^\.tooling/(src|tests|demo)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Three kinds of file the whitespace fixers must not touch. The note folders are
      # the user's own prose. Templates/ carries trailing spaces on purpose -- `due: `,
      # `- ` and `- [ ] ` leave the cursor where typing continues, and stripping them
      # changes what every note created from the template starts as. .obsidian/ is
      # written by the app from memory and rewritten on next launch, so a newline added
      # here is both discarded and a permanently dirty tree.
      - id: trailing-whitespace
        exclude: ^(Items|Docs|Meetings|Reviews|Journal|Templates|\.obsidian)/
      - id: end-of-file-fixer
        exclude: ^(Items|Docs|Meetings|Reviews|Journal|Templates|\.obsidian)/
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: docs-current
        name: generated docs match the code
        entry: bash -c 'cd .tooling && .venv/bin/python -m planner.docsgen --check'
        language: system
        pass_filenames: false
        files: ^\.tooling/src/planner/(api/routes|domain|contracts)/

      # Both names, because the trunk is not called the same thing in every copy of this
      # vault: start-fresh.sh re-initialises a fresh clone on `main`, and this repository
      # kept `master`. Naming one branch left the guard inert in the other, which is how
      # it shipped -- it never once refused a commit here.
      - id: no-commit-to-trunk
        name: refuse a commit straight to the trunk
        entry: bash -c 'case "$(git branch --show-current)" in main|master) echo "commit to a branch and open a PR"; exit 1;; esac'
        language: system
        pass_filenames: false
        always_run: true
